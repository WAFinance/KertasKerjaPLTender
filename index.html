<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kertas Kerja Pengadaan Langsung</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{--bg:#eef1f5;--sf:#fff;--tx:#1f2937;--mu:#6b7280;--ac:#0b5cab;--ac2:#094a89;--acs:#e6f0fa;--hd:#12304f;--hd2:#0d2640;--rd:#d62e3a;--bd:#d9dee6;--in:#f8fafc;--ok:#15803d}
:root[data-theme=dark]{--bg:#12161c;--sf:#1b212a;--tx:#e6e9ee;--mu:#9aa4b2;--ac:#4c8fe0;--ac2:#3a7bcb;--acs:#1e2f45;--hd:#0c1a2b;--hd2:#08121f;--bd:#2d3643;--in:#141a22;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
/* ===== header (gaya SPSE / INAPROC) ===== */
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;background:linear-gradient(180deg,var(--hd),var(--hd2));color:#fff;border-bottom:3px solid var(--rd)}
#top .lg{height:40px;width:auto;background:#fff;border-radius:6px;padding:3px 5px}
#top .tt{line-height:1.15}#top .tt b{display:block;font-size:15px;letter-spacing:.2px}#top .tt small{opacity:.75;font-size:11.5px}
#top .sp{flex:1}
#top .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;font-size:12px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
#top button:hover{background:rgba(255,255,255,.22)}
#wrap{display:flex;align-items:flex-start;min-height:calc(100vh - 59px)}
#side{width:260px;flex:none;background:var(--sf);border-right:1px solid var(--bd);position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto;padding:12px 10px}
#side .grp{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);font-weight:600;margin:14px 8px 4px}
#side .grp:first-child{margin-top:2px}
#side button.t{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;margin:1px 0;border:0;border-left:3px solid transparent;background:none;color:var(--tx);border-radius:4px;cursor:pointer;font:inherit;font-size:13px}
#side button.t .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--acs);color:var(--ac);font-size:11px;font-weight:600;display:grid;place-items:center}
#side button.t.sub{margin-left:22px;width:calc(100% - 22px);font-size:12.5px;color:var(--mu)}
#side button.t:hover{background:var(--bg)}
#side button.t.on{background:var(--acs);border-left-color:var(--ac);color:var(--ac);font-weight:600}
#side button.t.on .n{background:var(--ac);color:#fff}
#side .foot{margin-top:16px;padding:10px 8px;border-top:1px solid var(--bd);font-size:12px;color:var(--mu)}
#side label{margin-top:6px}
body.min #side{display:none}
#main{flex:1;min-width:0;padding:18px 22px 40px}
.crumb{font-size:12px;color:var(--mu);margin-bottom:2px}
.ptitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.ptitle h2{margin:0;font-size:20px;flex:1;min-width:200px;font-weight:600}
.badge{font-size:12px;color:var(--mu)}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--acs);color:var(--ac);font-weight:600}
.tag[hidden]{display:none}.tag.warn{background:#fef3c7;color:#92400e}
/* ===== form ===== */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:6px;margin-bottom:14px;overflow:hidden}
.card>h3{margin:0;padding:10px 14px;font-size:13.5px;font-weight:600;background:var(--acs);color:var(--ac);border-bottom:1px solid var(--bd);border-left:4px solid var(--ac)}
.card .bd{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:4px;background:var(--in);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--ac) 40%,transparent);border-color:var(--ac)}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{background:var(--in);text-align:left;padding:7px 8px;border-bottom:2px solid var(--bd);font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
table.tb td{padding:5px 8px;border-bottom:1px solid var(--bd)}
table.tb .no{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--ac);white-space:nowrap}
.btn{background:var(--ac);color:#fff;border:0;padding:8px 16px;border-radius:4px;cursor:pointer;font:inherit;font-size:13px;font-weight:500}
.btn:hover{background:var(--ac2)}
.btn.o{background:var(--sf);color:var(--ac);border:1px solid var(--ac)}
.btn.o:hover{background:var(--acs)}
.btn.d{background:#b91c1c}
.ib{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:4px;padding:4px 9px;cursor:pointer}
/* ===== toolbar editor ===== */
#tbar{position:sticky;top:59px;z-index:20;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;box-shadow:0 2px 6px #0000000d}
#tbar .g{display:flex;align-items:center;gap:3px;padding-right:12px;border-right:1px solid var(--bd)}
#tbar .g:last-child{border:0;padding:0}
#tbar .gl{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin-right:4px}
#tbar button,#tbar select,#tbar input{width:auto;padding:4px 8px;font-size:12.5px;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:4px;cursor:pointer}
#tbar button:hover{background:var(--acs);border-color:var(--ac)}
#tbar button.x:hover{background:#fee2e2;border-color:#dc2626}
#tbar input[type=date]{cursor:text}
#tbar .pr{background:var(--ac);color:#fff;border-color:var(--ac)}
.hint{font-size:12px;color:var(--mu);margin:-6px 0 12px}
.hint .fld{display:inline}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:1}
/* ===== kertas dokumen ===== */
.page{background:#fff;color:#000;width:210mm;min-height:297mm;margin:0 auto 16px;padding:18mm 20mm;font:11pt "Abadi","Abadi MT",Arial,sans-serif;line-height:1.4;box-shadow:0 1px 8px #0003;outline:none}
.page.land{width:297mm;min-height:210mm;padding:14mm 14mm}
.page:focus-within{box-shadow:0 0 0 2px var(--ac),0 2px 10px #0003}
.page .kop{display:flex;align-items:center;gap:10px;text-align:center;border-bottom:3px double #000;padding-bottom:6px;margin-bottom:14px}
.kop img{height:23mm;width:auto}.kop .kt{flex:1}.kop h2{margin:0;font-size:15pt}.kop .sp{width:17mm}
.page h4{text-align:center;margin:10px 0 2px;font-size:12pt;text-decoration:underline}
.page .no{text-align:center;margin-bottom:12px}
.page p{text-align:justify;margin:6px 0}
.page table{border-collapse:collapse;width:100%}
.page table.g td,.page table.g th{border:1px solid #000;padding:3px 5px;vertical-align:top}
.page table.g th{text-align:center;background:#f2f2f2}
.page table.k td{padding:1px 4px;vertical-align:top}
.page table.k td.kl{width:42mm}.page table.k td.kc{width:4mm}
.page table.ttd{margin-top:22px;text-align:center}.page table.ttd td{vertical-align:top;padding:2px 6px}
.page .sg{height:20mm}
.page .c{text-align:center}.page .r{text-align:right}
.page .fld{background:rgba(11,92,171,.1);border-radius:2px;cursor:default}
.page:focus-within table.k td,.page:focus-within table.ttd td{outline:1px dashed #cbd5e1;outline-offset:-1px}
.page td.cur,.page th.cur{box-shadow:inset 0 0 0 2px rgba(11,92,171,.55)}
.page table.rev{margin-top:4px}.page table.rev td{padding:2px 4px;vertical-align:top;text-align:justify}
.page table.rev td.n{width:10mm;text-align:left;white-space:nowrap}.page table.rev td.l{width:8mm;white-space:nowrap}.page table.rev td.m{width:10mm;text-align:center}
.page table.rev tr.s td{font-weight:bold;padding-top:10px}.page table.rev tr.u td{font-weight:bold;padding-top:6px}
.page .cont{font-style:italic}.page table.g tr.sec td{background:#f3f3f3}
.page .wr{border:1px solid #888;min-height:15mm;padding:3px 6px;margin:2px 0 8px;text-align:left}
.page .hl{font-weight:bold;margin-top:6px}
.page .bt{font-weight:bold;text-align:center;margin:6px 0 10px;letter-spacing:.3px}
.page .pb{break-before:page;height:0}
.page [data-comp]{margin:8px 0}
.nego{font-size:9.5pt}
.nego table{border-collapse:collapse;width:100%}
.nego th,.nego td{border:1px solid #000;padding:2px 4px;vertical-align:middle}
.nego th{background:#f2f2f2;text-align:center}
.nego td.r{text-align:right;white-space:nowrap}
.nego tr.sc td{font-weight:bold;background:#fafafa}
.nego input{border:0;border-bottom:1px dotted #999;background:transparent;color:#000;padding:1px 2px;border-radius:0;font:inherit;width:100%;-moz-appearance:textfield}
.nego input[type=number]::-webkit-inner-spin-button,.nego input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.nego input.nr{text-align:right}
.nego .mini{font-size:11px;padding:2px 7px;border:1px solid #888;background:#f3f4f6;color:#111;border-radius:3px;cursor:pointer;margin:2px 2px 2px 0}
.nego .mini.x{color:#b91c1c;border-color:#b91c1c;background:#fff}
.nego .acts{margin:4px 0 10px}
@media (max-width:900px){#side{position:fixed;z-index:25;top:59px;box-shadow:4px 0 14px #0004}#main{padding:12px}.page{transform-origin:top left}}
@media print{
 body{background:#fff}#top,#side,#tbar,.noprint,.crumb,.ptitle,.hint,#toast{display:none!important}
 #wrap{display:block}#main{padding:0}
 .page,.page.land{box-shadow:none!important;margin:0;width:auto;min-height:0;padding:0}
 .page .fld{background:none}.page:focus-within table.k td,.page:focus-within table.ttd td{outline:0}.page td.cur,.page th.cur{box-shadow:none}
 .page.land{page:land}
 @page{size:A4;margin:18mm 20mm}@page land{size:A4 landscape;margin:12mm}
 .page table.g tr,.nego tr{break-inside:avoid}
 .nego input{border:0}.nego .mini,.nego .acts{display:none}
 .wr{break-inside:avoid}
}
/* ===== login / mode / admin ===== */
body.noapp #top,body.noapp #wrap{display:none}
#auth{position:fixed;inset:0;z-index:100;display:none;overflow:auto;background:linear-gradient(135deg,#0d2640,#12304f 55%,#0b5cab)}
#auth.on{display:block}
.alogin{min-height:100%;display:grid;place-items:center;padding:20px}
.abox{width:100%;max-width:420px;background:var(--sf);color:var(--tx);border-radius:10px;box-shadow:0 10px 40px #0006;overflow:hidden;border-top:4px solid var(--rd)}
.abox.wide{max-width:560px}.abox.mode{max-width:760px}
.abox .ah{display:flex;gap:12px;align-items:center;padding:18px 22px 6px}
.abox .ah img{height:46px;background:#fff;border-radius:6px;padding:3px 5px}
.abox .ah b{display:block;font-size:16px}.abox .ah small{color:var(--mu)}
.abox form{padding:6px 22px 20px}.abox label{margin-top:10px}
.abox form .btn{width:100%;margin-top:16px;padding:10px}
.abox .lnk{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:12.5px}
.abox .lnk a{color:var(--ac);cursor:pointer}
.amsg{margin-top:10px;padding:8px 10px;border-radius:5px;font-size:12.5px}
.amsg.err{background:#fee2e2;color:#991b1b}.amsg.ok{background:#dcfce7;color:#166534}.amsg.inf{background:#e0f2fe;color:#075985}
.mcards{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 22px 14px}
.mcard{border:2px solid var(--bd);border-radius:10px;padding:18px;cursor:pointer;background:var(--in);text-align:left;font:inherit;color:var(--tx)}
.mcard:hover{border-color:var(--ac);background:var(--acs)}
.mcard .ic{font-size:30px}.mcard b{display:block;font-size:16px;margin:6px 0 4px}.mcard small{color:var(--mu);display:block;font-size:12px}
@media(max-width:620px){.mcards{grid-template-columns:1fr}}
/* ===== Lampiran Nego: kolom bisa diatur + akuntansi ===== */
.nego .nscroll{overflow-x:auto}
.nego table{table-layout:fixed;width:max-content}
.nego tr.rzr td{border:0;padding:0;height:9px;background:#e8eef7;position:relative}
.nego tr.rzr td i{position:absolute;right:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:3;touch-action:none;background:#b9cbe6}
.nego tr.rzr td i:hover,.nego tr.rzr td i.on{background:#0b5cab}
.nego .rzhint{font:11px Arial;color:#475569;margin:0 0 4px}
.ac{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.nego .ai{display:flex;align-items:center;gap:3px}.nego .ai span{flex:none}.nego .ai input{text-align:right}
.nego td{overflow:hidden}
.nego tr.timp td{background:#fde8e8}
.page table.pk{width:100%;margin-top:6px}.page table.pk td{padding:7px 4px 3px;vertical-align:bottom}
@media screen{.page .pb{border-top:2px dashed #94a3b8;margin:18px -20mm;position:relative;overflow:visible}
.page .pb::after{content:"— halaman berikutnya —";position:absolute;right:20mm;top:-9px;background:#fff;color:#64748b;font:10pt Arial;padding:0 6px}}
@media print{.nego tr.rzr,.nego .rzhint{display:none!important}.nego .nscroll{overflow:visible}.nego tr.timp td{background:#fde8e8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body.noapp #auth{display:none}}
/* ===== Dashboard Proyek ===== */
#auth.dash{background:var(--bg)}
.dwrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px;color:var(--tx)}
.dtop{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--hd2),var(--hd));color:#fff;padding:12px 18px;border-radius:10px;border-bottom:3px solid var(--rd);flex-wrap:wrap}
.dtop img{height:42px;background:#fff;border-radius:6px;padding:3px 5px}.dtop b{display:block;font-size:16px}.dtop small{opacity:.8}.dtop .sp{flex:1}
.dtop .btn.o{background:transparent;color:#fff;border-color:#ffffff66}
.dstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.dstats .st{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}.dstats .st small{color:var(--mu);display:block}.dstats .st b{font-size:24px;color:var(--ac)}
.dpanel{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;margin-bottom:16px}.dpanel h3{margin:0 0 8px;font-size:14px}
.hb{display:grid;grid-template-columns:minmax(120px,28%) 1fr 150px;gap:10px;align-items:center;margin:5px 0;font-size:12.5px}.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb div{background:var(--in);border-radius:4px;height:12px}.hb i{display:block;height:12px;border-radius:4px;background:var(--ac)}.hb i.TN{background:var(--rd)}.hb em{font-style:normal;text-align:right;color:var(--mu)}
.dbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.dbar input{flex:1;min-width:200px}.dbar select{width:auto}
.chips{display:flex;gap:6px}.chip{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:12.5px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:14px 16px}.pcard.TN{border-left-color:var(--rd)}
.pcard .ph{display:flex;justify-content:space-between;align-items:center}.pcard .ph small,.pcard .pm{color:var(--mu);font-size:12px}
.pcard h4{margin:8px 0 4px;font-size:15px;line-height:1.3}.pcard .pv{font-weight:700;color:var(--ac);margin:8px 0 6px}.pcard .pv small{font-weight:400;color:var(--mu)}
.tag.tn{background:#fde8ea;color:var(--rd)}
.bar{background:var(--in);border-radius:4px;height:7px;margin:4px 0 2px;overflow:hidden}.bar i{display:block;height:7px;background:var(--ok)}
.pa{display:flex;gap:6px;margin-top:12px}.pa .btn{padding:6px 12px}
.dempty{text-align:center;padding:60px 20px;color:var(--mu);background:var(--sf);border:1px dashed var(--bd);border-radius:10px}
.dmodal{position:fixed;inset:0;background:#0008;z-index:200;display:grid;place-items:center;padding:20px}.dbox{background:var(--sf);color:var(--tx);border-radius:10px;padding:20px 22px;width:100%;max-width:440px}.dbox h3{margin:0 0 6px}

.dbar .lbl{font-size:12px;color:var(--mu);font-weight:600}
.chip.jn em{font-style:normal;opacity:.7;font-size:11px;margin-left:2px}
.tag.jn{background:#ede9fe;color:#5b21b6}.tg2{display:flex;gap:5px;align-items:center}
.jh{margin:18px 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}.jh em{font-style:normal;color:var(--mu);font-weight:400}
.dmodal textarea{width:100%}

.npsteps{display:flex;gap:6px;margin:12px 0 14px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.npsteps span{padding:4px 10px;border-radius:999px;background:var(--in);border:1px solid var(--bd)}
.npsteps span.on{background:var(--ac);color:#fff;border-color:var(--ac)}.npsteps span.done{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.npsteps b{margin-right:3px}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:2px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit}
.jcard:hover{border-color:var(--ac);background:var(--acs)}.jcard b{font-size:13.5px}
@media(max-width:520px){.jgrid{grid-template-columns:1fr}}

.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--sf)}
.seg button{border:0;background:transparent;color:var(--tx);padding:7px 12px;cursor:pointer;font:inherit;font-size:12.5px}
.seg button.on{background:var(--ac);color:#fff}
.lwrap{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
.ltab{width:100%;border-collapse:collapse;font-size:13px}.ltab th{position:sticky;top:0;text-align:left;background:var(--in);padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
.ltab td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}.ltab tr:hover td{background:var(--acs)}
.ltab .btn{padding:5px 10px;font-size:12px}.ltab .bar{margin:0 0 2px}
.ltab tr.jhr td{background:var(--in);font-size:13px}.ltab tr.jhr em{font-style:normal;color:var(--mu)}
.plink{color:var(--ac);font-weight:600;cursor:pointer}.plink:hover{text-decoration:underline}
.ltab .pm{color:var(--mu);font-size:12px}.ltab .tag{white-space:nowrap}

.nego tr.lv1 td{background:#d6e2f3}.nego tr.lv2 td{background:#e6eef9}.nego tr.lv3 td{background:#f2f5fa}
.nego tr.hdi td{font-style:italic;background:#fbfbfd}.nego tr.hdi input{font-style:italic}
@media print{.nego tr.lv1 td,.nego tr.lv2 td,.nego tr.lv3 td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ===== Perbaikan v5 ===== */
/* dashboard: header tetap, hanya isi (content) yang bergulir */
#auth.dash{overflow:hidden}
.dwrap{height:100%;display:flex;flex-direction:column;padding-bottom:0}
.dtop{flex:none}
.dscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 8px 60px 0;margin-right:-8px;scrollbar-gutter:stable}
/* sidebar berwarna per kelompok menu */
#side{background:linear-gradient(180deg,var(--sf),var(--in))}
#side .grp{display:flex;align-items:center;gap:7px;color:color-mix(in srgb,var(--gc,var(--ac)) 72%,var(--tx));font-weight:700}
#side .grp::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--gc,var(--ac));flex:none}
#side button.t .n{background:color-mix(in srgb,var(--gc,var(--ac)) 18%,var(--sf));color:color-mix(in srgb,var(--gc,var(--ac)) 72%,var(--tx))}

 let fn="",a=spec;const i=spec.indexOf(":");if(i>0){fn=spec.slice(0,i);a=spec.slice(i+1)}

 else if(a.startsWith("b."))v=S.b[a.slice(2)];
 else if(a.startsWith("t."))v=T(doc)[a.slice(2)];
 if(fn=="rp")return rp(v);if(fn=="terb")return terb(v);if(fn=="up")return String(v??"").toUpperCase();
 return v??"";
}

/* ===== Lampiran Reviu: dibangun dari sheet LAMPREVIU(<jenis>) di Excel ===== */
function lrevHTML(){
 const j=S.b.jenis,nodes=DATA.LREV[j]||DATA.LREV.PK,hasM=nodes.some(n=>n.m);
 let rows="";const mc=x=>hasM?`<td class=m>${x||""}</td>`:"";
 nodes.forEach(n=>{
  if(n.t=="sec")rows+=`<tr class=s><td class=n>${n.n}</td><td colspan=2>${E(n.x)}</td>${mc()}</tr>`;
  else if(n.t=="sub")rows+=`<tr class=u><td class=n>${n.n}</td><td colspan=2>${E(n.x)}</td>${mc()}</tr>`;
  else if(n.t=="it"&&n.lv==1)rows+=`<tr><td class=n>${n.n}</td><td colspan=2>${E(n.x).replace(/\n/g,"<br>")}</td>${mc(n.m)}</tr>`;
  else if(n.t=="it")rows+=`<tr><td class=n></td><td class=l>${n.n}</td><td>${E(n.x).replace(/\n/g,"<br>")}</td>${mc(n.m)}</tr>`;
  else if(n.t=="cont")rows+=`<tr><td class=n></td><td class=l></td><td class=cont>${E(n.x)}</td>${mc()}</tr>`;
  else if(n.t=="hasil"||n.t=="rek"){
   const lab=n.t=="hasil"?"Hasil Reviu / Pembahasan : (jika ada)":"Rekomendasi : (jika ada)";
   rows+=`<tr><td class=n></td><td colspan=2><div class=hl>${lab}</div><div class=wr>${n.x.length?n.x.map(E).join("<br>"):"<br>"}</div></td>${mc()}</tr>`}
 });
 let p2=`<div class=pb></div><div class=bt>BAGIAN KEDUA</div><table class="rev k">`;
 const refs=DATA.LREV2.filter(n=>n.t=="ref");
 refs.forEach(n=>{p2+=`<tr><td class=n>${n.n}</td><td>${E(n.x)}</td></tr>`});p2+=`</table>`;
 let open=false;
 DATA.LREV2.forEach(n=>{
  if(n.t=="sec"){if(open)p2+="</table>";open=false;p2+=`<p style="margin-top:12px"><b>${n.n} ${E(n.x)}</b></p>`}
  else if(n.t=="p")p2+=`<p>${E(n.x)}</p>`;
  else if(n.t=="th"){p2+=`<table class=g><tr><th style="width:10mm">${n.c[0]}</th><th style="width:42%">${n.c[1]}</th><th>${n.c[2]}</th></tr>`;open=true}
  else if(n.t=="tr")p2+=`<tr><td class=c>${n.n}</td><td>${E(n.u)}</td><td>${tok(n.e)}</td></tr>`;
 });
 if(open)p2+="</table>";
 return `<div class=bt>LAMPIRAN BERITA ACARA REVIU DOKUMEN PERSIAPAN PENGADAAN DAN<br>KERTAS KERJA PERSIAPAN PEMILIHAN TAHUN ANGGARAN ${F("b.ta")}</div>

function calcNego(root){
 root=root||document;const set=(k,v)=>root.querySelectorAll(`[data-c="${k}"]`).forEach(e=>e.textContent=nf(v));

 set("th",m.tot[0]);set("tp",m.tot[1]);set("tn",m.tot[2]);set("th2",m.tot[0]);set("tp2",m.tot[1]);set("tn2",m.tot[2]);

let lastRange=null;
document.addEventListener("selectionchange",()=>{const s=getSelection();if(s.rangeCount){const r=s.getRangeAt(0);if($("#pg")&&$("#pg").contains(r.commonAncestorContainer))lastRange=r.cloneRange()}
 document.querySelectorAll(".cur").forEach(x=>x.classList.remove("cur"));const c=curCell();if(c)c.classList.add("cur")});
function curCell(){const s=getSelection();if(!s.rangeCount)return null;let n=s.anchorNode;if(!n)return null;n=n.nodeType==3?n.parentElement:n;const c=n&&n.closest&&n.closest("td,th");return c&&c.closest("#pg")&&!c.closest("[data-comp]")?c:null}
function grid(tb){const g=[];[...tb.rows].forEach((tr,r)=>{g[r]=g[r]||[];let c=0;[...tr.cells].forEach(cell=>{while(g[r][c])c++;for(let i=0;i<cell.rowSpan;i++)for(let j=0;j<cell.colSpan;j++)(g[r+i]=g[r+i]||[])[c+j]=cell;c+=cell.colSpan})});return g}
function tbOp(op){
 const c=curCell();if(!c){toast("Klik dulu di dalam sel tabel");return}
 const tb=c.closest("table"),tr=c.parentElement,r=tr.rowIndex,g=grid(tb),ci=g[r].indexOf(c),ncol=Math.max(...g.map(x=>x.length));
 if(op=="rowA"||op=="rowB"){
  const at=op=="rowB"?r+(c.rowSpan):r,nr=document.createElement("tr"),done=new Set();
  for(let k=0;k<ncol;){const up=at>0?(g[at-1]||[])[k]:null,dn=(g[at]||[])[k];
   if(up&&dn&&up===dn){if(!done.has(up)){up.rowSpan++;done.add(up)}k+=up.colSpan}
   else{const td=document.createElement("td"),rc=(g[Math.min(r,g.length-1)]||[])[k];if(rc&&rc.tagName=="TD")td.className=rc.className;td.innerHTML="<br>";nr.appendChild(td);k++}}
  const ref=tb.rows[at];if(ref)ref.parentNode.insertBefore(nr,ref);else tb.rows[at-1].parentNode.appendChild(nr);
 }
 else if(op=="rowD"){
  if(tb.rows.length==1){if(confirm("Ini baris terakhir. Hapus seluruh tabel?"))tb.remove()}
  else if([...tr.cells].some(x=>x.rowSpan>1))return toast("Baris ini berisi sel gabungan (rowspan); hapus baris lain dulu");
  else{const seen=new Set();g[r].forEach(x=>{if(x.parentElement!==tr&&!seen.has(x)){x.rowSpan--;seen.add(x)}});tr.remove()}
 }
 else if(op=="colL"||op=="colR"){
  const at=op=="colR"?ci+c.colSpan:ci,done=new Set();
  [...tb.rows].forEach((row,rr)=>{const left=at>0?g[rr][at-1]:null,right=g[rr][at];
   if(left&&right&&left===right){if(!done.has(left)){left.colSpan++;done.add(left)}return}
   const tag=((right||left||{}).tagName)||"TD",td=document.createElement(tag);td.innerHTML="<br>";
   const ref=right||left;if(ref&&ref.tagName=="TD")td.className=ref.className;
   const own=[...row.cells];let before=null;for(const x of own){if(g[rr].indexOf(x)>=at){before=x;break}}
   if(before)row.insertBefore(td,before);else row.appendChild(td)});
 }
 else if(op=="colD"){
  if(ncol==1){if(confirm("Ini kolom terakhir. Hapus seluruh tabel?"))tb.remove()}
  else{const done=new Set();[...tb.rows].forEach((row,rr)=>{const x=g[rr][ci];if(!x||done.has(x))return;done.add(x);if(x.colSpan>1)x.colSpan--;else x.remove()})}
 }
 else if(op=="tblD"){if(confirm("Hapus seluruh tabel ini?"))tb.remove()}
 capture();
}

/* parse angka format Indonesia: "1.234.567,89" / "1234567,89" / "1234567.89" */
const pn=s=>{if(typeof s=="number")return isFinite(s)?s:0;s=String(s??"").trim().replace(/Rp\.?/gi,"").replace(/[\s\u00a0]/g,"").replace(/%$/,"");if(!s)return 0;
  if(s.includes(",")&&s.includes(".")){s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"")}
  else if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  const v=parseFloat(s);return isNaN(v)?0:v};
/* format akuntansi: "Rp." di kiri sel, angka rata kanan -> Rp.   1.234.567,00 */
const acc=n=>`<span class=ac><span>Rp.</span><span>${nf(n)}</span></span>`;
const pctF=(a,b)=>b?(a/b*100).toLocaleString("id-ID",{minimumFractionDigits:2,maximumFractionDigits:2})+" %":"";
const lines=t=>String(t||"").split("\n").map(s=>s.trim()).filter(Boolean);

/* ---------- PL: field & data tambahan untuk Lampiran BA Evaluasi ---------- */
FIELDS.push(["Penawaran & Evaluasi Teknis (dipakai Lampiran BA Evaluasi Penawaran)",[
 ["evKuasa","Surat Kuasa (keterangan)"],
 ["evPers","Personel Manajerial (satu per baris, mis. Pelaksana Lapangan (a.n Nama) - SKK ...)","area"],

 ["evHs110","Harga satuan di atas 110% HPS","sel:Tidak Ada|Ada"],
 ["evHs0","Mata pembayaran harga nol / tidak ditulis","sel:Tidak Ada|Ada"]]]);
Object.assign(DEF,{evKuasa:"Tidak Dikuasakan",
 evPers:"Pelaksana Lapangan (a.n Muh. Alfan Hidayatullah) - SKK Pelaksana Lapangan Pekerjaan Jalan\nPetugas K3 (a.n Veri Hidayat) - Petugas Keselamatan dan Kesehatan Kerja (K3) Konstruksi",
 evSewaDari:"PT. Pancadarma Puspawira",evSewaNo:"0299/PP/X/2026",
 evAlat:"Dump Truck (Hino; WU 342; 6-8 Ton)\nAsphalt Finisher (Dinapac; SD2500; 10 Ton)\nTandem Roller (Dinapac; CC2200; 8-10 Ton)\nGenset (Doosan; 200 Kva)\nP. Tire Roller (Sakai; TS2025; 8-10 Ton)\nPick Up (Daihatsu; S402RP; 1 Ton)",
 evHs110:"Tidak Ada",evHs0:"Tidak Ada"});

/* ---------- 1) BA EVALUASI PENAWARAN: BA + 4 lampiran = 5 halaman ---------- */
DOC["BA-EP"]=()=>{
 const L=DATA.LDK[S.b.jenis]||DATA.LDK.PK, MS="Memenuhi Syarat";
 const head=t=>`<div class=pb></div><div class=bt style="font-size:12pt">${t}</div><div style="margin:2px 0 8px">Lampiran BA No : ${F("no:BA-EP")}</div>${kv([["Nama Paket",F("b.paket")],["Nilai HPS",F("rp:b.hps")]])}`;
 const th=(c1)=>`<table class=g style="font-size:9.5pt"><tr><th style="width:10mm">No</th><th>${c1}</th><th style="width:36mm">Nama Peserta<br><span style="font-weight:normal">${F("b.pNama")}</span></th><th style="width:32mm">Keterangan</th></tr>`;
 const r=(n,t,h,k,cls)=>`<tr${cls?` class=${cls}`:""}><td class=c>${n}</td><td>${t}</td><td class=c>${h}</td><td>${k||""}</td></tr>`;
 const sec=(n,t)=>`<tr class=sec><td class=c><b>${n}</b></td><td colspan=3><b>${t}</b></td></tr>`;
 const ttdC=()=>`<table class=ttd style="margin-top:6px"><tr><td>Pejabat Pengadaan<div style="height:13mm"></div><b><u>${F("b.pp")}</u></b><br>NIP. ${F("b.ppNip")}</td></tr></table>`;
 const hasil=(t,v)=>`<table class=g style="margin-top:8px"><tr><td style="width:54%"><b>${t}</b></td><td class=c><b>${v}</b></td></tr></table>`;
 const evRow=(n,jud)=>`<tr><td class=c>${n}</td><td>${jud}</td><td>${F("b.pNama")}</td><td class=c>LULUS</td><td></td></tr>`;
 /* --- halaman 1: Berita Acara --- */
 let h=`${kop()}${judul("BERITA ACARA HASIL EVALUASI PENAWARAN")}
<p>${intro()} telah melaksanakan Evaluasi Dokumen Penawaran, metode Pengadaan Langsung untuk paket :</p>${ket()}
<p><b>A. Pembukaan Penawaran</b> dari 1 peserta yang diundang dan memasukkan dokumen penawaran :</p><table class=g><tr><th style="width:10mm">No</th><th>Data Peserta</th><th style="width:48mm">Nilai Penawaran</th></tr><tr><td class=c>1</td><td>Nama Peserta : ${F("b.pNama")}<br>Alamat : ${F("b.pAlamat")}</td><td class=r>${F("rp:b.hTawar")}</td></tr></table>
<p style="margin-bottom:2px"><b>B. Evaluasi Penawaran</b></p><table class=g><tr><th style="width:10mm">No.</th><th style="width:40mm">Evaluasi</th><th>Nama Peserta</th><th style="width:26mm">Hasil Evaluasi</th><th style="width:28mm">Keterangan</th></tr>${evRow(1,"Administrasi")}${evRow(2,"Kualifikasi")}${evRow(3,"Teknis")}${evRow(4,"Harga/Biaya")}</table>
<p style="margin-top:10px">Demikian berita acara dibuat dan ditandatangani pada hari, tanggal dan bulan sebagaimana tersebut diatas untuk diketahui dan dipergunakan sebagaimana mestinya.</p>${ttdPP()}`;
 /* --- halaman 2: Evaluasi Administrasi --- */
 h+=head("EVALUASI ADMINISTRASI")+th("Nama Dokumen")+
  sec("A","SURAT PENAWARAN")+
  r("1)","Jangka waktu berlakunya surat penawaran tidak kurang dari waktu sebagaimana tercantum dalam LDP; dan",MS,F("b.berlaku"))+
  r("2)","Jangka waktu pelaksanaan pekerjaan yang ditawarkan tidak melebihi jangka waktu sebagaimana tercantum dalam LDP.",MS,F("b.waktu"))+
  sec("B","SURAT KUASA")+r("3)","Surat kuasa (apabila dikuasakan)",MS,F("b.evKuasa"))+
  sec("C","DOKUMEN PENAWARAN")+r("4)","Dokumen penawaran teknis",MS)+r("5)","Dokumen penawaran harga; dan",MS)+r("6)","Data kualifikasi",MS)+`</table>`+
  hasil("Hasil Evaluasi Administrasi","Memenuhi Persyaratan Administrasi")+`${ttdC()}`;
 /* --- halaman 3: Evaluasi Kualifikasi (dari LDK sesuai jenis pengadaan) --- */
 let q="";
 L.forEach(x=>{
  if(x.k=="sec"){const t=x.t.toUpperCase().startsWith("KUALIFIKASI")?x.t:"KUALIFIKASI "+x.t;q+=sec(x.n,tok(t));return}
  q+=r(x.n,tok(x.t),MS,"",x.k=="sub"?"sb":"");
 });
 h+=head("EVALUASI KUALIFIKASI")+th("Dokumen Kualifikasi")+q+`</table>`+hasil("Hasil Evaluasi Kualifikasi","Memenuhi Persyaratan")+`${ttdC()}`;
 /* --- halaman 4: Evaluasi Teknis --- */
 const pers=lines(S.b.evPers),alat=lines(S.b.evAlat),sw=S.b.evSewaDari?` (Sewa dari ${E(S.b.evSewaDari)}${S.b.evSewaNo?` dengan Surat Perjanjian Sewa No. ${E(S.b.evSewaNo)}`:""})`:"";
 let t4=r("1","<b>Personel Manajerial</b>",MS);pers.forEach((x,i)=>t4+=r("",`${i+1}) ${E(x)}`,MS));
 t4+=r("2",`<b>Peralatan Utama</b>${sw}`,MS);alat.forEach((x,i)=>t4+=r("",`${i+1}) ${E(x)}`,MS));
 t4+=r("3","<b>Rencana Keselamatan Konstruksi (RKK)</b> yang terdiri atas:","")+r("","a. Elemen SMKK",MS)+r("","b. Pakta Komitmen Keselamatan Konstruksi",MS);
 h+=head("EVALUASI TEKNIS")+th("Dokumen Penawaran Teknis")+t4+`</table>`+hasil("Hasil Evaluasi Teknis","Memenuhi Persyaratan")+`${ttdC()}`;
 /* --- halaman 5: Evaluasi Harga/Biaya --- */
 const kl=v=>v=="Ada"?"Lakukan Klarifikasi":"Tidak Lakukan Klarifikasi";
 h+=head("EVALUASI HARGA/BIAYA")+th("Dokumen Penawaran Harga/Biaya")+
  r("1","Rincian harga penawaran (Daftar Kuantitas dan Harga).","","")+
  r("","1) Penawaran sebelum koreksi aritmatik",`<span style="display:block;text-align:right">${F("rp:b.hTawar")}</span>`)+
  r("","2) Penawaran setelah koreksi aritmatik",`<span style="display:block;text-align:right">${F("rp:b.hKoreksi")}</span>`)+
  r("","3) Perbandingan total harga penawaran dengan HPS (%)",F("pctHps"))+
  r("2","Harga satuan diatas 110% HPS",E(S.b.evHs110),kl(S.b.evHs110))+
  r("3","Mata pembayaran yang harganya nol atau tidak ditulis",E(S.b.evHs0),kl(S.b.evHs0))+`</table>`+
  hasil("Hasil Evaluasi Harga/Biaya","Memenuhi Persyaratan")+`${ttdC()}`;
 return h;
};

/* ---------- 3) DAFTAR HADIR: + ketentuan, catatan & Tanda Tangan Pejabat Pengadaan ---------- */
DOC["ABS"]=()=>{
 const rows=[F("b.ppk")+" (PPK)",F("b.pp")+" (Pejabat Pengadaan)",F("b.pPim")+" ("+F("b.pNama")+")"];while(rows.length<6)rows.push("");
 const ket=["Direksi yang namanya ada dalam akta pendirian/perubahan atau pihak yang sah menurut akta pendirian/perubahan;","Penerima kuasa dari direksi yang nama penerima kuasanya tercantum dalam akta pendirian/perubahan;","Pihak lain yang bukan direksi dapat menghadiri pembuktian kualifikasi selama berstatus sebagai tenaga kerja tetap dan memperoleh kuasa dari Direksi yang namanya ada dalam akta pendirian/perubahan atau pihak yang sah menurut akta pendirian/perubahan; dan","Kepala cabang perusahaan yang diangkat oleh kantor pusat yang dibuktikan dengan dokumen otentik."];

<table class=g><tr><th style="width:10mm">No.</th><th>Nama Yang Menghadiri</th><th>Jabatan</th><th style="width:30mm">No HP.</th><th style="width:34mm">Tanda Tangan</th></tr>${rows.map((x,i)=>`<tr style="height:9mm"><td class=c>${i+1}</td><td>${x}</td><td></td><td></td><td></td></tr>`).join("")}</table>
<p style="margin:10px 0 2px"><b>Ketentuan kehadiran Peserta pada tahapan Verifikasi/Pembuktian Kualifikasi</b></p>
<table class=k style="font-size:9.5pt">${ket.map((x,i)=>`<tr><td style="width:6mm">${i+1}.</td><td style="text-align:justify">${x}</td></tr>`).join("")}</table>
<p style="margin:8px 0 2px"><b>Catatan</b></p><p style="margin-top:0">Jika peserta lulus tahapan pembuktian kualifikasi, maka dilanjutkan Klarifikasi dan Negosiasi Teknis dan Biaya.</p>
<table class=ttd style="margin-top:8px"><tr><td style="width:55%"></td><td>Pejabat Pengadaan<div style="height:14mm"></div><b><u>${F("b.pp")}</u></b><br>NIP. ${F("b.ppNip")}</td></tr></table>`};

/* ---------- 2) LAMPIRAN NEGOSIASI: kolom bisa diatur + format akuntansi Rp. xx.xxx.xxx,00 ---------- */
const NG_DEF=[46,170,58,44,126,44,130,126,44,130,126,44,130,26], RK_DEF=[40,220,150,150,150];
function cwGet(key,def){const a=(S.cw&&S.cw[key])||[],sc=(S.cws&&S.cws[key])||1;return def.map((w,i)=>Math.round((a[i]>=20?a[i]:w)*sc))}
const cwSum=a=>a.reduce((x,y)=>x+y,0);
const cwHtml=a=>`<colgroup>${a.map(w=>`<col style="width:${w}px">`).join("")}</colgroup>`;
const rzRow=(n,extra=0)=>`<tr class="rzr noprint">${Array.from({length:n},(_,i)=>`<td><i data-ci=${i} title="Tarik untuk mengatur lebar kolom · klik ganda = ukuran awal"></i></td>`).join("")}${extra?`<td></td>`.repeat(extra):""}</tr>`;
const rzHintF=(keys,wrap)=>{const k0=keys.split(",")[0],sc=Math.round(((S.cws&&S.cws[k0])||1)*100);return `<div class="rzhint noprint"><span>📋 Ctrl+V dari Excel bisa langsung. ↔ Tarik batang biru di atas judul kolom untuk mengatur lebar kolom (klik ganda = ukuran awal).</span><div class=rzctl><label>Lebar tabel <input type=range min=40 max=200 step=5 value=${sc} oninput="cwScale('${keys}',this.value)"> <b id="cwsv_${k0}">${sc}%</b></label>${wrap?`<label><input type=checkbox ${S.nwrap===0?"":"checked"} onchange="negoWrap(this.checked)"> Bungkus teks Uraian (wrap)</label>`:""}<button class=mini onclick="cwReset()">Reset lebar</button></div></div>`};
/* textarea Uraian (auto-tinggi bila wrap) & input angka 2 desimal */
const ta=(i,j)=>`<textarea class="ur" rows=1 spellcheck=false data-i=${i} data-j=${j} data-k=u oninput="negoIn(this);autoG(this)" onkeydown="if(event.key=='Enter')event.preventDefault()">${E(S.nego[i].items[j].u)}</textarea>`;
const dec=(i,j,k,pct)=>`<input class="nr dec" data-i=${i} data-j=${j} data-k=${k} value="${nf(pct?Math.round(S.nego[i].items[j][k]*10000)/100:S.nego[i].items[j][k])}" onfocus="monF(this)" onblur="monB(this)" oninput="negoIn(this)">`;
function autoG(el){if(el.closest(".nego.nowrap")){el.style.height="";return}el.style.height="auto";el.style.height=(el.scrollHeight+1)+"px"}
function autoGAll(){document.querySelectorAll(".nego textarea.ur").forEach(autoG)}
let _agr=0;const autoGLater=()=>{if(_agr)return;_agr=requestAnimationFrame(()=>{_agr=0;autoGAll()})};
function negoWrap(on){S.nwrap=on?1:0;document.querySelectorAll(".nego").forEach(n=>n.classList.toggle("nowrap",!on));autoGAll();sv()}
function cwScale(keys,v){S.cws=S.cws||{};const nw=Math.max(.3,Math.min(3,v/100));
 keys.split(",").forEach(key=>{const old=S.cws[key]||1;S.cws[key]=nw;
  document.querySelectorAll('table[data-cw="'+key+'"]').forEach(t=>{const cols=[...t.querySelectorAll("col")];cols.forEach(c=>c.style.width=(parseFloat(c.style.width)*nw/old)+"px");t.style.width=cwSum(cols.map(c=>parseFloat(c.style.width)))+"px"})});
 const l=document.getElementById("cwsv_"+keys.split(",")[0]);if(l)l.textContent=Math.round(v)+"%";autoGLater();sv()}
function negoClear(){if(!confirm("Hapus seluruh isi tabel Lampiran Negosiasi? Tindakan ini tidak dapat dibatalkan."))return;S.nego=[];const c=nm();if(c)renderNego(c);sv()}
const mon=(i,j,k)=>`<div class=ai><span>Rp.</span><input class="nr money" data-i=${i} data-j=${j} data-k=${k} value="${nf(S.nego[i].items[j][k])}" onfocus="monF(this)" onblur="monB(this)" oninput="negoIn(this)"></div>`;
function monF(el){const v=pn(el.value);el.value=v?String(v).replace(".",","):"";el.select()}
function monB(el){el.value=nf(pn(el.value))}
function cwReset(){S.cw={};S.cws={};sv();const c=nm();if(c)renderNego(c);const t=document.querySelector("[data-comp=tim]");if(t&&typeof renderTim=="function")renderTim(t)}

/* nomor/label bagian: pakai label hasil tempel (I, II.1, A …) bila ada, selain itu romawi otomatis */
function secLabel(i){const s=S.nego[i];if(s.n!=null)return null;let k=0;for(let x=0;x<=i;x++)if(S.nego[x].n==null)k++;return ROM[k]||k}
function renderNego(el){
 S.cw=S.cw||{};const cw=cwGet("nego",NG_DEF),cr=cwGet("rekap",RK_DEF);
 const inp=(i,j,k,num)=>`<input ${num?`type=number step=any class=nr`:""} value="${E(num&&k.length<=2&&k[1]=="p"?Math.round(S.nego[i].items[j][k]*10000)/100:S.nego[i].items[j][k])}" data-i=${i} data-j=${j} data-k=${k} oninput="negoIn(this)">`;
 const lab=i=>{const s=S.nego[i],r=secLabel(i);return r!=null?r:`<input value="${E(s.n)}" data-i=${i} data-k=n oninput="negoSec(this)" style="text-align:center;font-weight:bold">`};
 let h=`<div class="nego${S.nwrap===0?" nowrap":""}"><div class="acts noprint top"><button class=mini onclick="pasteDlg('nego')">📋 Tempel dari Excel</button><button class="mini x" onclick="negoClear()">🗑 Hapus Tabel</button><button class=mini onclick="negoApply()">Terapkan total ke Bank Data (Harga Penawaran / Negosiasi)</button></div>${rzHintF("nego",1)}<div class=nscroll><table data-cw=nego style="width:${cwSum(cw)}px">${cwHtml(cw)}${rzRow(13,1)}
<tr><th rowspan=2>No.</th><th rowspan=2>Uraian</th><th colspan=5>Harga Perkiraan Sendiri</th><th colspan=3>Harga Penawaran</th><th colspan=3>Harga Negosiasi</th><td class=noprint style="border:0"></td></tr>
<tr><th>Vol.</th><th>Sat.</th><th>Harga Satuan (Rp)</th><th>Pajak (%)</th><th>Jumlah Harga (Rp)</th><th>Harga Satuan (Rp)</th><th>Pajak (%)</th><th>Jumlah Harga (Rp)</th><th>Harga Satuan (Rp)</th><th>Pajak (%)</th><th>Jumlah Harga (Rp)</th><td class=noprint style="border:0"></td></tr>`;
 S.nego.forEach((s,i)=>{const lv=s.lv||1;
  h+=`<tr class="sc lv${lv}"><td style="text-align:center">${lab(i)}</td><td colspan=12><input value="${E(s.t)}" data-i=${i} data-k=t oninput="negoSec(this)" style="font-weight:bold;width:60%;margin-left:${(lv-1)*14}px"> <span class=noprint><button class=mini onclick="negoAdd(${i})">+ Baris</button><button class="mini x" onclick="negoDelSec(${i})">Hapus bagian</button></span></td><td class=noprint style="border:0"></td></tr>`;
  s.items.forEach((it,j)=>{const no=it.no!=null?E(it.no):(j+1);
   if(it.hd){h+=`<tr class=hdi><td style="text-align:center">${no}</td><td colspan=12>${ta(i,j)}</td><td class=noprint style="border:0"><button class="mini x" title="Hapus baris" onclick="negoDel(${i},${j})">✕</button></td></tr>`;return}
   h+=`<tr><td style="text-align:center">${no}</td><td>${ta(i,j)}</td><td>${dec(i,j,"v")}</td><td>${inp(i,j,"s")}</td>
<td>${mon(i,j,"h")}</td><td>${dec(i,j,"hp",1)}</td><td class=r data-c="h.${i}.${j}"></td>
<td>${mon(i,j,"p")}</td><td>${dec(i,j,"pp",1)}</td><td class=r data-c="p.${i}.${j}"></td>
<td>${mon(i,j,"n")}</td><td>${dec(i,j,"np",1)}</td><td class=r data-c="n.${i}.${j}"></td><td class=noprint style="border:0"><button class="mini x" title="Hapus baris" onclick="negoDel(${i},${j})">✕</button></td></tr>`});
 });
 if(!S.nego.length)h+=`<tr class="nl noprint"><td colspan=13>Tabel kosong — klik “📋 Tempel dari Excel” atau “+ Tambah bagian” di bawah.</td></tr>`;
 h+=`<tr class=sc><td colspan=6 style="text-align:right">JUMLAH TOTAL BIAYA</td><td class=r data-c="th"></td><td colspan=2></td><td class=r data-c="tp"></td><td colspan=2></td><td class=r data-c="tn"></td><td class=noprint style="border:0"></td></tr></table></div>
<div class="acts noprint"><button class=mini onclick="negoAddSec()">+ Tambah bagian</button></div>
<p><b>REKAPITULASI</b></p><div class=nscroll><table data-cw=nego style="width:${cwSum(cw)}px">${cwHtml(cw)}<tr><th>No.</th><th colspan=5>Uraian</th><th>Harga Perkiraan Sendiri</th><th colspan=3>Harga Penawaran</th><th colspan=3>Harga Negosiasi</th></tr>`;
 S.nego.forEach((s,i)=>{const lv=s.lv||1,r=secLabel(i),has=s.items.some(x=>!x.hd);
  h+=`<tr class="${has?"":"lv"+lv}"><td style="text-align:center">${r!=null?r:E(s.n)}</td><td colspan=5 style="padding-left:${6+(lv-1)*14}px">${has?"":"<b>"}${E(s.t)}${has?"":"</b>"}</td>${has?`<td class=r data-c="rh.${i}"></td><td colspan=2></td><td class=r data-c="rp.${i}"></td><td colspan=2></td><td class=r data-c="rn.${i}"></td>`:"<td colspan=7></td>"}</tr>`});
 h+=`<tr class=sc><td colspan=6 style="text-align:right">Jumlah Total</td><td class=r data-c="th2"></td><td colspan=2></td><td class=r data-c="tp2"></td><td colspan=2></td><td class=r data-c="tn2"></td></tr></table></div></div>`;
 el.innerHTML=h;calcNego(el);autoGAll();setTimeout(autoGAll,80);
}
function negoSec(el){const i=+el.dataset.i;S.nego[i][el.dataset.k]=el.value;if(el.dataset.k=="t"){const c=nm();if(c)calcNego(c)}sv()}
function negoAdd(i){const s=S.nego[i],last=s.items.filter(x=>!x.hd).slice(-1)[0]||{hp:.11,pp:.11,np:.11},o={u:"Uraian baru",v:1,s:"ls",h:0,hp:last.hp,p:0,pp:last.pp,n:0,np:last.np};

const TM_DEF=[56,250,70,52,112,132,112,132,64,110,26];
function timSum(){let h=0,p=0;S.tim.forEach(x=>{if(x.k=="it"){h+=x.v*x.h;p+=x.v*x.p}});const r=S.ppn==null?.11:S.ppn;
 const th=h*(1+r),tp=p*(1+r);return{h,p,ph:h*r,pp:p*r,th,tp,bh:Math.floor(th/1000)*1000,bp:Math.floor(tp/1000)*1000}}

 h+=rows.map(r=>`<tr class=sc><td colspan=5 style="text-align:right">${r[0]}</td><td class=r data-tc="${r[1]}"></td><td></td><td class=r data-tc="${r[2]}"></td><td colspan=2></td><td class=noprint style="border:0"></td></tr>`).join("")+`</table></div>

 ["jh","jp","ph","pp","th","tp","bh","bp"].forEach(k=>set(k,m[{jh:"h",jp:"p",ph:"ph",pp:"pp",th:"th",tp:"tp",bh:"bh",bp:"bp"}[k]]));

/* =====================================================================
   BAGIAN 6 — Tempel dari Excel (Lampiran Nego PL & Lampiran Harga Timpang Tender)
   ===================================================================== */
function parseTSV(t){ /* tab-delimited dengan dukungan sel bertanda kutip (hasil salin Excel) */
 const rows=[];let row=[],cell="",q=false;t=t.replace(/\r\n?/g,"\n");
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){cell+='"';i++}else q=false}else cell+=c}
  else if(c=='"'&&cell==="")q=true;
  else if(c=="\t"){row.push(cell.trim());cell=""}
  else if(c=="\n"){row.push(cell.trim());rows.push(row);row=[];cell=""}
  else cell+=c}
 if(cell!==""||row.length){row.push(cell.trim());rows.push(row)}
 return rows}
const isNumS=s=>s!==""&&/^-?(rp\.?)?[\d.,]+%?$/i.test(s.replace(/[\s\u00a0]/g,""));
const pjS=x=>{if(x===""||x==null)return .11;const v=pn(x);return /%/.test(x)?v/100:(v>1?v/100:v)};
const noLikeS=s=>/^([IVXLC]+(\.\d+)*|[A-Z]|\d+(\.\d+)*)[.)]?$/i.test(s)&&s.length<=9;
const isRomanS=s=>/^[IVXLC]+\.?$/i.test(s);
const isTotRow=(no,u)=>/^(jumlah|total|ppn|rekap|pembulatan|dibulatkan|terbilang|sub\s?total|grand)/i.test(u)||/^(jumlah|total)/i.test(no);
const isHdrRow=(no,u)=>/^no\.?$/i.test(no)||/^(no\.?\s*)?(mata\s*pembayaran\s*)?uraian/i.test(u)||/^no\.?(\s|$)/i.test(u);
const fm=n=>Number(n||0).toLocaleString("id-ID",{minimumFractionDigits:2,maximumFractionDigits:2});

/* baca baris mentah (kolom TIDAK dibuang, agar posisi kolom sesuai Excel) */
function rawRows(text){let rows=parseTSV(text).filter(r=>r.some(c=>c!==""));if(!rows.length)return null;const w=Math.max(...rows.map(r=>r.length));return rows.map(r=>r.concat(Array(w-r.length).fill("")))}
/* kolom Vol/Qty: angka pertama setelah sel teks pertama (No boleh angka), dipilih yang paling sering */
function volIdx(rows){const c={};rows.forEach(r=>{let t=-1;for(let i=0;i<r.length;i++){if(r[i]!==""&&!isNumS(r[i])&&!/^([IVXLC]+|[A-Z])\.?$/i.test(r[i])){t=i;break}}
  if(t<0)return;for(let i=t+1;i<r.length;i++){if(r[i]==="")continue;if(isNumS(r[i])){c[i]=(c[i]||0)+1}break}});
 const k=Object.keys(c).sort((x,y)=>c[y]-c[x])[0];return k===undefined?-1:+k}
/* kolom dari judul header Excel: Harga Satuan / Pajak / Jumlah (urut = HPS, Penawaran, Negosiasi) */
function headerCols(rows,vi){const H={h:[],pj:[],jm:[],persen:-1};
 for(const r of rows.slice(0,10)){if(r.filter(isNumS).length>=4)continue;
  r.forEach((c,i)=>{const t=c.toLowerCase();if(/harga\s*satuan/.test(t))H.h.push(i);else if(/^(pajak|ppn)/.test(t))H.pj.push(i);else if(/^jumlah/.test(t))H.jm.push(i);else if(/^persen/.test(t))H.persen=i})}
 const u=a=>[...new Set(a)].sort((x,y)=>x-y);H.h=u(H.h).filter(i=>i>vi);H.pj=u(H.pj).filter(i=>i>vi);H.jm=u(H.jm).filter(i=>i>vi);return H}
function leftParts(r,vi){const L=r.slice(0,vi).filter(x=>x!=="");let no="",u="";
 if(L.length>=2){if(noLikeS(L[0])){no=L[0];u=L.slice(1).join(" ")}else u=L.join(" ")}
 else if(L.length==1){if(noLikeS(L[0])&&!/[a-z]{3,}/i.test(L[0]))no=L[0];else u=L[0]}
 return{no,u}}
const allCaps=u=>u===u.toUpperCase()&&/[A-Z]/.test(u);
/* hitung ulang harga satuan dari kolom Jumlah (Excel menampilkan angka dibulatkan, Jumlah lebih presisi) */
function fixPrice(v,h,pj,J){if(!(v>0)||!(J>0))return{h,adj:false,bad:false};const calc=v*h*(1+pj),d=Math.abs(J-calc);
 if(d<=0.011)return{h,adj:false,bad:false};if(d/J>0.01)return{h,adj:false,bad:true};return{h:J/(v*(1+pj)),adj:true,bad:false}}

const romVal=t=>{const m={I:1,V:5,X:10,L:50,C:100};let tot=0,pv=0;[...t.toUpperCase().replace(/\.$/,"")].reverse().forEach(c=>{const v=m[c]||0;if(v<pv)tot-=v;else{tot+=v;pv=v}});return tot};
const headingLike=no=>{no=(no||"").replace(/\.$/,"");return /^[IVXLC]+(\.\d+)*$/i.test(no)||/^[A-Z]$/i.test(no)};
function parseNegoPaste(text,opt){opt=opt||{};
 const rows=rawRows(text);if(!rows)return{err:"Belum ada data."};
 const vi=volIdx(rows);if(vi<0)return{err:"Kolom Vol. tidak ditemukan. Pastikan blok yang disalin memuat kolom Vol. (angka) dan Uraian."};
 const H=headerCols(rows,vi),w=rows[0].length;let G;
 if(H.h.length>=3&&H.pj.length>=3)G=[0,1,2].map(g=>({h:H.h[g],pj:H.pj[g],jm:H.jm[g]??-1}));
 else if(w>=vi+11)G=[{h:vi+2,pj:vi+3,jm:vi+4},{h:vi+5,pj:vi+6,jm:vi+7},{h:vi+8,pj:vi+9,jm:vi+10}];
 else if(w>=vi+8)G=[{h:vi+2,pj:vi+3,jm:-1},{h:vi+4,pj:vi+5,jm:-1},{h:vi+6,pj:vi+7,jm:-1}];
 else return{err:`Kolom setelah Vol. kurang (${w-vi-1}). Salin sampai Jumlah Harga Negosiasi (Vol, Sat, lalu 3 kelompok Harga Satuan/Pajak/Jumlah).`};
 const out=[],skipped=[];let cur=null,prev=null,adj=0,bad=0,merged=0,lastGood=-1,done=false,nHd=0,lastRoman=0,lastLetter=0;const xl=[[],[],[]];
 const newSec=(n,t,lv)=>{out.push(cur={t,n,lv,items:[]});prev=null};
 const ensure=()=>{if(!cur)newSec("","PEKERJAAN",1)};
 /* tingkat judul: I/II/III = BAB (1), II.1 = sub-bab (2), A/B/C = grup (3). Huruf yang juga angka romawi (C, D, I, L, V, X) dibedakan lewat urutan */
 const hlevel=n=>{n=(n||"").replace(/\.$/,"");if(!n)return 0;
  if(/^[IVXLC]+\.\d+(\.\d+)*$/i.test(n)){lastLetter=0;return 2}
  if(/^[IVXLC]{2,}$/i.test(n)){lastRoman=romVal(n);lastLetter=0;return 1}
  if(/^[A-Z]$/i.test(n)){const L=n.toUpperCase().charCodeAt(0)-64,isR="IVXLC".includes(n.toUpperCase());
   if(isR&&romVal(n)==lastRoman+1&&L!=lastLetter+1){lastRoman=romVal(n);lastLetter=0;return 1}
   lastLetter=L;return 3}
  return 0};
 rows.forEach((r,ri)=>{const{no,u}=leftParts(r,vi),lab=(no+" "+u).trim(),all=r.join(" ");
  if(done)return;
  if(/rekapitulasi/i.test(all)||(out.length&&isHdrRow(no,u))){done=true;return}
  if(isHdrRow(no,u))return;
  if(isTotRow(no,u)||(!u&&/(jumlah|total)/i.test(all)&&r.some(isNumS))){lastGood=ri;G.forEach((g,gi)=>{if(g.jm>=0&&isNumS(r[g.jm]))xl[gi].push(pn(r[g.jm]))});return}
  if(!lab&&r.every(c=>c===""||isNumS(c))&&!u){if(cur&&G.some(g=>g.jm>=0&&isNumS(r[g.jm]))){lastGood=ri;G.forEach((g,gi)=>{if(g.jm>=0&&isNumS(r[g.jm]))xl[gi].push(pn(r[g.jm]))});return}if(r.some(c=>c!==""))skipped.push({row:ri+1,t:r.filter(Boolean).join(" | ").slice(0,60),why:"angka tanpa uraian"});return}
  const sat=r[vi+1],volNum=isNumS(r[vi]),hasPrice=G.some(g=>isNumS(r[g.h])&&pn(r[g.h])>0);
  const itemLike=u&&volNum&&!(headingLike(no)&&!sat)&&(sat!==""||/^\d/.test(no)||hasPrice);
  if(itemLike){lastGood=ri;ensure();
   const v=pn(r[vi]),it={u,v,s:sat,h:[0,0,0],pj:[0,0,0]};
   G.forEach((g,gi)=>{const pj=pjS(r[g.pj]);let h=pn(r[g.h]);
    if(opt.adjust&&g.jm>=0&&isNumS(r[g.jm])){const f=fixPrice(v,h,pj,pn(r[g.jm]));h=f.h;if(f.adj)adj++;if(f.bad){bad++;skipped.push({row:ri+1,t:lab.slice(0,50),why:`Jumlah kelompok ${gi+1} tidak cocok dengan Vol×Harga (kolom mungkin bergeser)`,soft:1})}}
    it.h[gi]=h;it.pj[gi]=pj});
   if(opt.fillN&&!it.h[2]&&it.h[1]){it.h[2]=it.h[1];it.pj[2]=it.pj[1]}
   cur.items.push(prev={no,u:it.u,v:it.v,s:it.s,h:it.h[0],hp:it.pj[0],p:it.h[1],pp:it.pj[1],n:it.h[2],np:it.pj[2]})}
  else if(u&&/^\d+$/.test(no)&&!volNum&&!hasPrice){lastGood=ri;ensure();nHd++;cur.items.push(prev={no,u,hd:1,v:0,s:"",h:0,hp:.11,p:0,pp:.11,n:0,np:.11})} /* baris induk (mis. "Pemasangan pintu …" dengan anak a, b, c) */
  else if(u&&headingLike(no)){lastGood=ri;newSec(no.replace(/\.$/,""),u,hlevel(no)||3)}
  else if(u&&no===""&&allCaps(u)&&rowEmptyFrom(r,vi)){lastGood=ri;newSec("",u,3)}
  else if(u&&no===""&&rowEmptyFrom(r,vi)&&prev){prev.u+=" "+u;merged++}
  else if(u||no)skipped.push({row:ri+1,t:lab.slice(0,50),why:"bukan baris pekerjaan/bagian"})});
 const nItem=out.reduce((a,x)=>a+x.items.filter(i=>!i.hd).length,0);
 if(!nItem)return{err:"Tidak ada baris pekerjaan yang terbaca (kolom Vol. harus berisi angka)."};
 const sum=[0,0,0];out.forEach(sc=>sc.items.forEach(i=>{sum[0]+=i.v*i.h*(1+i.hp);sum[1]+=i.v*i.p*(1+i.pp);sum[2]+=i.v*i.n*(1+i.np)}));
 return{data:out,sum,xl,adj,bad,merged,nHd,skipped:skipped.filter(x=>x.row-1<=lastGood),nSec:out.length,nItem}}

function parseTimPaste(text,opt){opt=opt||{};
 const rows=rawRows(text);if(!rows)return{err:"Belum ada data."};
 const vi=volIdx(rows);if(vi<0)return{err:"Kolom Kuantitas tidak ditemukan. Pastikan blok yang disalin memuat kolom Kuantitas (angka) dan Uraian."};
 const H=headerCols(rows,vi),w=rows[0].length;let G;
 if(H.h.length>=2)G={h:H.h[0],jh:H.jm[0]??-1,p:H.h[1],jp:H.jm[1]??-1,ket:H.persen>=0?H.persen+1:-1};
 else if(w>=vi+7)G={h:vi+2,jh:vi+3,p:vi+4,jp:vi+5,ket:w>=vi+8?vi+7:-1};
 else if(w>=vi+5)G={h:vi+2,jh:vi+3,p:vi+4,jp:-1,ket:-1};
 else if(w>=vi+4)G={h:vi+2,jh:-1,p:vi+3,jp:-1,ket:-1};
 else return{err:`Kolom setelah Kuantitas kurang (${w-vi-1}). Salin sampai Harga Penawaran.`};
 const out=[],skipped=[],xl=[[],[]];let adj=0,bad=0,prev=null,merged=0,lastGood=-1,done=false;
 rows.forEach((r,ri)=>{const{no,u}=leftParts(r,vi),lab=(no+" "+u).trim();
  if(done)return;
  if(isHdrRow(no,u)){if(out.some(x=>x.k=="it"))done=true;return}
  if(isTotRow(no,u)||(!u&&/(jumlah|total)/i.test(r.join(" "))&&r.some(isNumS))){lastGood=ri;if(G.jh>=0&&isNumS(r[G.jh]))xl[0].push(pn(r[G.jh]));if(G.jp>=0&&isNumS(r[G.jp]))xl[1].push(pn(r[G.jp]));return}
  if(!u&&r.every(c=>c===""||isNumS(c))){if(out.length&&((G.jh>=0&&isNumS(r[G.jh]))||(G.jp>=0&&isNumS(r[G.jp])))){lastGood=ri;if(G.jh>=0&&isNumS(r[G.jh]))xl[0].push(pn(r[G.jh]));if(G.jp>=0&&isNumS(r[G.jp]))xl[1].push(pn(r[G.jp]));return}if(r.some(c=>c!==""))skipped.push({row:ri+1,t:r.filter(Boolean).join(" | ").slice(0,60),why:"angka tanpa uraian"});return}
  const sat=r[vi+1];
  if(u&&isNumS(r[vi])&&!(isRomanS(no)&&!sat)&&(sat!==""||/^\d/.test(no)||isNumS(r[G.h]))){
   lastGood=ri;const v=pn(r[vi]);let h=pn(r[G.h]),p=pn(r[G.p]);
   if(opt.adjust&&v>0){if(G.jh>=0&&isNumS(r[G.jh])){const J=pn(r[G.jh]);if(J>0&&Math.abs(J-v*h)>0.011){if(Math.abs(J-v*h)/J<.01){h=J/v;adj++}else{bad++;skipped.push({row:ri+1,t:lab.slice(0,50),why:"Jumlah HPS tidak cocok dengan Qty×Harga",soft:1})}}}
    if(G.jp>=0&&isNumS(r[G.jp])){const J=pn(r[G.jp]);if(J>0&&Math.abs(J-v*p)>0.011){if(Math.abs(J-v*p)/J<.01){p=J/v;adj++}else{bad++;skipped.push({row:ri+1,t:lab.slice(0,50),why:"Jumlah Penawaran tidak cocok dengan Qty×Harga",soft:1})}}}}
   out.push(prev={k:"it",n:no,u,v,s:sat,h,p,ket:G.ket>=0&&r[G.ket]&&!isNumS(r[G.ket])?r[G.ket]:""})}
  else if(u&&(isRomanS(no)||/^[A-Z]\.?$/i.test(no)||(no===""&&allCaps(u))||(no!==""&&rowEmptyFrom(r,vi))))out.push({k:"sec",n:no,t:u}),prev=null;
  else if(u&&no===""&&rowEmptyFrom(r,vi)&&prev){prev.u+=" "+u;merged++}
  else if(u||no)skipped.push({row:ri+1,t:lab.slice(0,50),why:"bukan baris pekerjaan/bagian"})});
 const items=out.filter(x=>x.k=="it");if(!items.length)return{err:"Tidak ada baris pekerjaan yang terbaca."};
 const sum=[items.reduce((a,i)=>a+i.v*i.h,0),items.reduce((a,i)=>a+i.v*i.p,0)];
 return{data:out,sum,xl,adj,bad,merged,skipped:skipped.filter(x=>x.row-1<=lastGood),nSec:out.length-items.length,nItem:items.length}}
const rowEmptyFrom=(r,i)=>r.slice(i).every(c=>c==="");

/* ---- dialog ---- */
let PD={kind:"",res:null};
function pasteDlg(kind,text){const old=document.getElementById("pdlg");if(old)old.remove();PD={kind,res:null};
